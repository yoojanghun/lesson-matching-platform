name: Build & Push Docker Image to ECR

on:
  push:
    branches:
      - main

permissions:
  id-token: write                       # OIDC 토큰 발급에 필요
  contents: read

env:
  AWS_REGION: ap-northeast-2            # 서울 리전으로 수정 완료!
  ECR_REPOSITORY: lesson-matching-ecr   # ECR 리포지토리 이름

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest

    steps:
      # ── 1. 소스 코드 체크아웃 ──────────────────────────────────
      - name: Checkout source code
        uses: actions/checkout@v4

      # ── 2. JDK 21 설정 ────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # ── 3. 실행 권한 부여 ─────────────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── 4. Spring Boot 빌드 ───────────────────────────────────
      - name: Build with Gradle (skip tests)
        run: ./gradlew bootJar -x test

      # ── 5. AWS 자격증명 (OIDC) ────────────────────────────────
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ── 6. ECR 로그인 ─────────────────────────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── 7. Docker 이미지 빌드 & 푸시 ─────────────────────────
      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # ── 8. EC2 서버에 SSH 접속하여 docker-compose 재배포 ───
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY
          script: |
            # GitHub Actions에서 로그인된 패스워드를 사용해 EC2 Docker 로그인
            docker login -u AWS -p $(aws ecr get-login-password --region ap-northeast-2 || echo "") $ECR_REGISTRY || true
            
            # 최신 이미지 Pull
            docker pull $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest
            
            # docker-compose 실행
            cd /home/ubuntu
            docker compose down || docker-compose down || true
            docker compose up -d || docker-compose up -d