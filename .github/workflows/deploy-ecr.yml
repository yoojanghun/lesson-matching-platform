name: Build & Push Docker Image to ECR

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: lesson-matching-ecr

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (skip tests)
        run: ./gradlew bootJar -x test

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # ── 8. Spring Boot EC2에 SSH 접속하여 재배포 ───
      - name: Deploy to App EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          SPRING_PROFILE: prod
          REDIS_HOST: ${{ secrets.REDIS_PRIVATE_IP }}
          MONGO_HOST: ${{ secrets.MONGO_PRIVATE_IP }}
          RDS_ENDPOINT: ${{ secrets.RDS_ENDPOINT }}
          RDS_USERNAME: ${{ secrets.RDS_USERNAME }}
          RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          envs: ECR_REGISTRY,ECR_REPOSITORY,SPRING_PROFILE,REDIS_HOST,MONGO_HOST,RDS_ENDPOINT,RDS_USERNAME,RDS_PASSWORD
          script: |
            aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin $ECR_REGISTRY

            docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest

            docker stop spring-app || true
            docker rm spring-app || true

            docker run -d \
              --name spring-app \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=$SPRING_PROFILE \
              -e SPRING_DATA_REDIS_HOST=$REDIS_HOST \
              -e SPRING_DATA_REDIS_PORT=6379 \
              -e SPRING_DATA_MONGODB_URI="mongodb://$MONGO_HOST:27017/lesson_db" \
              -e SPRING_DATASOURCE_URL="jdbc:mysql://$RDS_ENDPOINT:3306/lesson_db?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true" \
              -e SPRING_DATASOURCE_USERNAME=$RDS_USERNAME \
              -e SPRING_DATASOURCE_PASSWORD=$RDS_PASSWORD \
              -e SPRING_JPA_DATABASE_PLATFORM="org.hibernate.dialect.MySQLDialect" \
              --restart always \
              $ECR_REGISTRY/$ECR_REPOSITORY:latest

            docker image prune -f