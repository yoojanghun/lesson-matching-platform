spring:
  application:
    name: lesson-matching-platform

  # Datasource Configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/lesson_platform?serverTimezone=Asia/Seoul&createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:Janghun7926*}

  # JPA Configuration
  jpa:
    show-sql: true
    hibernate:
      # 로컬: create / 운영(prod): validate 또는 none
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:create}
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        # MySQL에서 ddl-auto: create 시 FK DROP 오류 방지
        # (존재하지 않는 FK를 DROP 시도할 때 발생하는 SQLSyntaxErrorException 무시)
        hbm2ddl:
          halt_on_error: false
    defer-datasource-initialization: true

  # SQL Init
  # 로컬: always / 운영(prod): never (매 배포마다 data.sql 재실행 방지)
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:always}

  # NoSQL (Redis, MongoDB, Elasticsearch)
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/lesson_chat}
    elasticsearch:
      uris: ${SPRING_ELASTICSEARCH_URIS:localhost:9200}

  # RabbitMQ
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual          # 수동 Ack 모드 (Consumer에서 직접 Ack/Nack 호출)
        prefetch: 1                       # 한 번에 1개 메시지만 처리 (Ack 전 다음 메시지 수신 안 함)
        recovery-interval: 30000          # 연결 실패 시 30초 간격으로 재시도 (기본 5초 → 로그 스팸 방지)
        retry:
          enabled: false                  # Spring Retry는 비활성 (Consumer 내부에서 직접 재시도 관리)

  # Security OAuth2
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:임시_클라이언트_아이디}
            client-secret: ${GOOGLE_CLIENT_SECRET:임시_클라이언트_시크릿}
            scope: profile, email

# Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  querydsl:
    enabled: false

# JWT
jwt:
  secret: ${JWT_SECRET:temp_jwt_secret_key_which_is_long_enough_to_be_secure_32_bytes}
  access-token-expiration: 900000       # 15분 (ms)
  refresh-token-expiration: 604800000   # 7일 (ms)

# Toss
toss:
  payments:
    secret-key: ${TOSS_SECRET:temp_toss_secret_key}
    confirm-url: https://api.tosspayments.com/v1/payments/confirm

# LangChain4j
langchain4j:
  ollama:
    chat-model:
      base-url: http://localhost:11434
      model-name: llama3.2:1b
      temperature: 0.2
      timeout: 60s

